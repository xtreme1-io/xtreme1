name: PR

# The repository's only pull-request check: build both images from the source in this PR,
# bring the stack up with them, and run the end-to-end smoke test that release.yml runs
# against published images.
#
# Security shape, kept deliberately boring — do not change these four lines without asking:
#   - pull_request, never pull_request_target: fork code never runs with write access.
#   - No secrets are read here, and none are needed.
#   - permissions is contents: read.
#   - No third-party actions beyond actions/checkout. If one is added, pin it to a commit SHA.
#
# No paths-ignore on purpose. A skipped job produces no check run, so a required check would
# sit at "Expected — Waiting for status" forever on a docs-only pull request. One monthly
# pull request does not need the saved minutes.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-24.04
    # Measured at 5-6 minutes over 14 runs; a failure is slower because `up --wait`
    # burns the backend healthcheck budget first. 30 leaves room without letting a
    # genuinely hung job hold a runner for an hour.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # docker-compose.yml pulls the released images by default; build this PR's code instead.
      - name: Compose override that builds from source
        run: |
          printf 'services:\n' > docker-compose.pr.yml
          printf '  backend:\n    image: xtreme1-backend:pr\n    pull_policy: never\n    build: ./backend\n' >> docker-compose.pr.yml
          printf '  frontend:\n    image: xtreme1-frontend:pr\n    pull_policy: never\n    build: ./frontend\n' >> docker-compose.pr.yml

      - name: Build
        run: docker compose -f docker-compose.yml -f docker-compose.pr.yml build backend frontend

      # Same service list as the release verify job. Besides the two model-profile services,
      # this also leaves out pcd-tools and image-vect-visualization, which have no profile and
      # would otherwise start; release v0.9.2 verified green without them.
      - name: Start the stack
        run: docker compose -f docker-compose.yml -f docker-compose.pr.yml up -d --wait nginx mysql redis minio backend frontend

      - name: Smoke test
        run: |
          mkdir -p samples
          docker run --rm --entrypoint sh -v "$PWD/samples:/out" xtreme1-backend:pr -c 'cp /app/*.zip /out/'
          pip install --quiet --break-system-packages requests   # Ubuntu 24.04 is PEP 668 managed
          python3 .github/ci-verify/smoke.py

      - name: Logs
        if: always()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.pr.yml ps -a
          docker compose -f docker-compose.yml -f docker-compose.pr.yml logs --no-color | tail -300
